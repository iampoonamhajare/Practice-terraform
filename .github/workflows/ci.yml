name: CI

on:
 push:
   branches : ["main"]

jobs:
	build:
		runs-on: ubuntu-latest

steps:
	- name : checkout code
	  uses : actions/checkout@v4

	- name: set up python
	  uses : actions/setup-python@v5
	  with:
		python-version: "3.11"

	- name : Install dependencies 
	  run : pip install -r requirements.txt

	- name : Build docker image
	  run : docker build -t blonix-app .   
